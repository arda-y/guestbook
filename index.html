<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="darkreader-lock">
<meta property="og:title" content="guestbook">
<meta property="og:description" content="i made this at 3am pls sign it means a lot to me :')">
<meta property="og:site_name" content="guestbook">
<meta property="og:image" content="https://arda0.net/assets/favicon">
<meta property="og:url" content="https://arda0.net/guestbook/">
<link rel="icon" href="/assets/favicon">
<title>guestbook</title>
<link rel="stylesheet" href="static/theme.css?v=7">
<script src="static/theme.js?v=7"></script>
</head>
<body>
<main>
<div class="top"><a href="https://arda0.net/">&larr; home</a><nav><div class="theme" role="group" aria-label="colour mode"><button type="button" data-mode="auto" aria-pressed="true">auto</button><button type="button" data-mode="light" aria-pressed="false">light</button><button type="button" data-mode="dark" aria-pressed="false">dark</button></div></nav></div>
<div class="titlerow"><h1>guestbook</h1><a href="/guestbook/faq">faq</a></div>
<p class="sub">leave a note, say hi.</p>
<form id="form">
<input id="name" type="text" placeholder="your name" required maxlength="100" autocomplete="nickname">
<span id="nc" class="cnt"></span>
<textarea id="msg" placeholder="leave a message..." required maxlength="500" rows="4"></textarea>
<span id="mc" class="cnt"></span>
<button type="submit">sign</button>
</form>
<p id="status" class="status" role="status" aria-live="polite"></p>
<div id="feed"></div>
<div class="pager"><button id="prev" type="button">&larr; newer</button><span id="page"></span><button id="next" type="button">older &rarr;</button></div>
</main>
<script>
(function () {
  var LIMIT = 10, idx = 0;
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function say(text) { $('status').textContent = text; }

  // Entries are built with DOM APIs (textContent), never innerHTML: names and
  // messages come from anonymous visitors and are shown to everyone else.
  function mk(e) {
    var a = el('article', 'entry'), h = el('header');
    var d = new Date(e.time + 'Z');
    h.append(el('span', 'n', e.name), el('span', 'd', isNaN(d) ? '' : d.toLocaleDateString(undefined, {year: 'numeric', month: 'short', day: 'numeric'})));
    var b = el('button', 'heart'), count = el('span', 'count', String(e.stars));
    b.type = 'button';
    b.append(document.createTextNode('\u2665 '), count);
    function mark() {
      b.classList.add('on'); b.disabled = true;
      b.title = 'you liked this. you can like it again after a week.';
    }
    if (e.liked) mark();
    b.addEventListener('click', function () {
      count.textContent = String(parseInt(count.textContent, 10) + 1);
      mark();
      fetch('post/star?entry_id=' + e.id, {method: 'POST'}).then(function (r) {
        if (r.ok) return r.json().then(function (j) { count.textContent = String(j.stars); });
        if (r.status === 409) { count.textContent = String(e.stars); say('you already liked that one this week.'); return; }
        throw 0;
      }).catch(function () {
        count.textContent = String(e.stars); b.classList.remove('on'); b.disabled = false;
        say('could not like that. try again in a bit.');
      });
    });
    var f = el('div', 'foot');
    f.append(b, el('span', 'eid', '#' + e.id));
    a.append(h, el('p', '', e.message), f);
    return a;
  }

  function load() {
    fetch('get/entry?index=' + idx + '&limit=' + LIMIT)
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (data) {
        $('feed').replaceChildren.apply($('feed'), data.map(mk));
        $('prev').disabled = idx === 0;
        $('next').disabled = data.length < LIMIT;
        $('page').textContent = 'page ' + (idx / LIMIT + 1);
      })
      .catch(function () { say('could not load entries. you may be rate limited, try again in a minute.'); });
  }
  $('next').onclick = function () { idx += LIMIT; load(); };
  $('prev').onclick = function () { idx = Math.max(0, idx - LIMIT); load(); };

  function counter(input, out) {
    var left = input.maxLength - input.value.length;
    out.textContent = left + ' characters left';
    out.classList.toggle('over', left <= 0);
  }
  var name = $('name'), msg = $('msg');
  name.addEventListener('input', function () { counter(name, $('nc')); });
  msg.addEventListener('input', function () { counter(msg, $('mc')); });
  counter(name, $('nc')); counter(msg, $('mc'));

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    fetch('post/entry?name=' + encodeURIComponent(name.value) + '&message=' + encodeURIComponent(msg.value), {method: 'POST'})
      .then(function (r) {
        if (!r.ok) throw r.status;
        name.value = ''; msg.value = ''; counter(name, $('nc')); counter(msg, $('mc'));
        say('signed. thank you!');
        idx = 0; load();
      })
      .catch(function (s) { say(s === 429 ? 'you can sign twice a day. try again tomorrow.' : 'could not post your message. try again in a bit.'); });
  });

  load();
})();
</script>
</body>
</html>
