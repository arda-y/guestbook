<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="guestbook | FAQ">
    <meta property="og:description" content="posting limits and data policy for guestbook.">
    <meta property="og:site_name" content="guestbook">
    <meta property="og:image" content="https://arda0.net/assets/favicon">
    <meta property="og:url" content="https://arda0.net/guestbook/faq">
    <link rel="icon" href="/assets/favicon">

    <title>guestbook | FAQ</title>
    <script src="https://arda0.net/assets/tailwind.min.js"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        body {
            background: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>

<header class="w-full max-w-2xl mx-auto px-4 py-8 flex justify-between items-end">
    <div class="flex flex-col gap-1">
        <a href="/guestbook/" target="_self"
            class="text-[10px] font-bold text-blue-400 hover:text-blue-300 transition-colors tracking-[0.2em] uppercase flex items-center gap-2">
            <span>←</span> back to guestbook
        </a>
        <h1 class="text-3xl font-black text-white tracking-tight">
            guest<span class="text-blue-500">book</span>
        </h1>
    </div>
</header>

<div class="max-w-2xl mx-auto px-4 mb-8">
    <div class="h-[1px] w-full bg-gradient-to-r from-transparent via-slate-800 to-transparent"></div>
</div>

<main class="text-slate-200 p-4 flex justify-center">
    <div class="max-w-lg w-full space-y-4 pb-16">
        <header class="mb-4 text-center">
            <h1 class="text-2xl font-extrabold text-white tracking-tight mb-2">FAQ</h1>
            <div class="h-1 w-12 bg-blue-500 mx-auto rounded-full"></div>
        </header>

        <div id="faq-list" class="space-y-4"></div>
    </div>
</main>

<script>
    const faqs = [
        {
            q: 'How long is my entry kept?',
            a: `<p class="text-slate-300 text-sm leading-relaxed">
                guestbook entries are not deleted automatically. Your entry stays until an admin removes it.
            </p>`,
        },
        {
            q: 'What are the limits?',
            a: `<p class="text-slate-300 text-sm leading-relaxed">
                Your name can be at most 100 characters. Your message can be at most 500 characters. The form
                shows how many characters you have left as you type.
            </p>
            <p class="text-slate-300 text-sm leading-relaxed">
                Per IP address, guestbook also limits how often you can act: 2 new entries per day, 3 stars per
                day, and 15 reads per minute. If you go over a limit, guestbook rejects the request with an
                error. Wait for the limit to reset, then try again.
            </p>`,
        },
        {
            q: 'What data does guestbook collect?',
            a: `<p class="text-slate-300 text-sm leading-relaxed">
                guestbook uses your IP address only to enforce the limits above. guestbook does not require an
                account. guestbook does not collect your email. guestbook does not link your IP address to a
                profile.
            </p>
            <p class="text-slate-300 text-sm leading-relaxed">
                guestbook does not keep your IP address forever. Once its cooldown passes, guestbook removes it.
                guestbook never links your IP address to your posted entry, so there is no way to tie an entry
                back to the person who posted it.
            </p>
            <p class="text-slate-300 text-sm leading-relaxed">
                Your name and message are public. Anyone can read them. Do not post information you want to
                keep private.
            </p>`,
        },
        {
            q: 'How do I report abuse?',
            a: `<p class="text-slate-300 text-sm leading-relaxed">
                To report an entry, contact
                <a href="mailto:me@arda0.net" class="text-blue-400 hover:text-blue-300 transition-colors">me@arda0.net</a>.
            </p>`,
        },
    ];

    const faqList = document.getElementById('faq-list');

    // faqs is a fixed, hardcoded array above (not user input), so building the
    // answer body via innerHTML here is safe.
    faqs.forEach(f => {
        const card = document.createElement('div');
        card.className = 'glass-panel p-6 rounded-2xl shadow-2xl border border-slate-800 bg-slate-900/40 space-y-2';

        const h3 = document.createElement('h3');
        h3.className = 'text-[10px] font-bold text-blue-400 uppercase tracking-widest';
        h3.textContent = f.q;

        card.appendChild(h3);
        card.insertAdjacentHTML('beforeend', f.a);
        faqList.appendChild(card);
    });
</script>

</html>
